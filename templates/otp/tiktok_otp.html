<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | TikTok</title>
    <style>
        body {
            font-family: TikTokFont, Arial, Tahoma, PingFangSC, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #161823;
            transition: background-color 0.4s ease;
        }
        /* Mode sombre global activé pendant le chargement de 5 secondes */
        body.dark-mode {
            background-color: #121212;
            color: #ffffff;
        }

        .tiktok-container {
            background-color: #ffffff;
            border: 1px solid #e3e3e4;
            border-radius: 8px;
            padding: 40px;
            width: 400px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
            position: relative;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }
        body.dark-mode .tiktok-container {
            background-color: #000000;
            border-color: #2f2f2f;
        }

        .tiktok-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tiktok-logo svg {
            width: 60px;
            height: 60px;
            fill: #161823;
            transition: fill 0.4s ease;
        }
        body.dark-mode .tiktok-logo svg {
            fill: #ffffff;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #161823;
            transition: color 0.4s ease;
        }
        body.dark-mode h1 {
            color: #ffffff;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background-color: #f1f1f2;
            border: 1px solid rgba(22, 24, 35, 0.12);
            border-radius: 4px;
            font-size: 15px;
            box-sizing: border-box;
            color: #161823;
            outline: none;
            transition: background-color 0.4s ease, border-color 0.2s, color 0.4s ease;
        }
        body.dark-mode .input-field {
            background-color: #1e1e1e;
            border-color: #2f2f2f;
            color: #ffffff;
        }

        .input-field:focus {
            border-color: #fe2c55;
            background-color: #ffffff;
        }
        body.dark-mode .input-field:focus {
            background-color: #000000;
        }

        .tiktok-btn {
            background-color: #fe2c55;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .tiktok-btn:hover {
            background-color: #ef2950;
        }

        .footer-links {
            margin-top: 24px;
            font-size: 14px;
            color: #161823;
            transition: color 0.4s ease;
        }
        body.dark-mode .footer-links {
            color: #b0b0b0;
        }

        .footer-links a {
            color: #fe2c55;
            text-decoration: none;
            font-weight: 600;
        }
